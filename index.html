<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xiangqi</title>
    <link rel="stylesheet" type="text/css" href="main.css">
    <script type="text/javascript">
       // Console polyfill for old WebKit (Kindle Mesquite ~Safari 5)
       if (typeof console === 'undefined') {
           var console = { log: function() {}, error: function() {}, warn: function() {}, info: function() {} };
       }
    </script>
    <script type="text/javascript" src="assets/wukong.js"></script>
    <script>
       function updateChromeBar() {
         var chromebar = {
           "appId": "xyz.kindlegame.xiangqi",
           "topNavBar": {
             "template": "title",
             "title": "Xiangqi",
             "buttons": [
               { "id": "KPP_MORE", "state": "enabled", "handling": "system" },
               { "id": "KPP_CLOSE", "state": "enabled", "handling": "system" }
             ]
           },
           "systemMenu": {
             "clientParams": {
               "profile": {
                 "name": "default",
                 "items": [
                   { "id": "XIANGQI_NEW_GAME", "state": "enabled", "handling": "notifyApp", "label": "New Game", "position": 0 },
                   { "id": "XIANGQI_UNDO", "state": "enabled", "handling": "notifyApp", "label": "Undo", "position": 1 },
                   { "id": "XIANGQI_FLIP", "state": "enabled", "handling": "notifyApp", "label": "Flip Board", "position": 2 }
                 ],
                 "selectionMode": "none",
                 "closeOnUse": true
               }
             }
           }
         };
         if (window.kindle && window.kindle.messaging) {
           window.kindle.messaging.sendMessage("com.lab126.chromebar", "configureChrome", chromebar);
         }
       };

       if (window.kindle && window.kindle.appmgr) {
         window.kindle.appmgr.ongo = function (ctx) {
           updateChromeBar();
           window.kindle.messaging.receiveMessage("systemMenuItemSelected", function (type, id) {
             switch (id) {
               case "XIANGQI_NEW_GAME": newGame(); break;
               case "XIANGQI_UNDO": undoMove(); break;
               case "XIANGQI_FLIP": flipBoard(); break;
             }
           });
         };
       }
    </script>
</head>
<body>
    <div id="game-container">
        <div id="header">
            <h1>Xiangqi</h1>
            <div id="status">Loading...</div>
        </div>

        <div id="menu-screen" class="screen">
            <div class="menu-content">
                <button type="button" class="menu-btn" id="vs-ai-btn">vs AI (Red)</button>
                <button type="button" class="menu-btn" id="vs-ai-black-btn">vs AI (Black)</button>
                <button type="button" class="menu-btn" id="two-player-btn">Two Player</button>
                <div class="difficulty-section">
                    <h3>AI Difficulty</h3>
                    <button type="button" class="diff-btn" data-depth="1">Easy</button>
                    <button type="button" class="diff-btn" data-depth="3">Medium</button>
                    <button type="button" class="diff-btn" data-depth="5">Hard</button>
                </div>
            </div>
        </div>

        <div id="board-screen" class="screen hidden">
            <div id="board-wrapper">
                <div id="xiangqiboard"></div>
            </div>
            <div id="controls">
                <button type="button" class="ctrl-btn" id="btn-new">New</button>
                <button type="button" class="ctrl-btn" id="btn-undo">Undo</button>
                <button type="button" class="ctrl-btn" id="btn-flip">Flip</button>
                <button type="button" class="ctrl-btn" id="btn-menu">Menu</button>
            </div>
            <div id="move-history-wrap">
                <textarea id="pgn" readonly rows="3"></textarea>
            </div>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <div class="menu-content">
                <h2 id="result-title">Game Over</h2>
                <button type="button" class="menu-btn" id="play-again-btn">Play Again</button>
                <button type="button" class="menu-btn" id="back-menu-btn">Main Menu</button>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="main.js"></script>
</body>
</html>
